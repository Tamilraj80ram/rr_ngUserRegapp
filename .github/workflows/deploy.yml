name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build UserService
        working-directory: backend/UserService
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Publish UserService
        working-directory: backend/UserService
        run: dotnet publish -c Release -o ../../publish/UserService

      # Uncomment once you have an Azure App Service (or swap for your host of choice)
      # - name: Deploy to Azure App Service
      #   if: github.ref == 'refs/heads/main'
      #   uses: azure/webapps-deploy@v3
      #   with:
      #     app-name: 'your-azure-app-name'
      #     publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      #     package: publish/UserService

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build Angular app
        working-directory: frontend
        run: npm run build -- --configuration production --base-href /${{ github.event.repository.name }}/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist/frontend/browser
