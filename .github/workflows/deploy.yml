name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build UserService
        working-directory: backend/UserService
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Run backend unit tests
        working-directory: backend/UserService.Tests
        run: |
          dotnet restore
          dotnet test --configuration Release

      - name: Publish UserService
        working-directory: backend/UserService
        run: dotnet publish -c Release -o ../../publish/UserService

      # Uncomment once you have an Azure App Service (or swap for your host of choice)
      # - name: Deploy to Azure App Service
      #   if: github.ref == 'refs/heads/main'
      #   uses: azure/webapps-deploy@v3
      #   with:
      #     app-name: 'your-azure-app-name'
      #     publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      #     package: publish/UserService

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:ci

      - name: Build Angular app
        working-directory: frontend
        run: npm run build -- --configuration production --base-href /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  # Full end-to-end test: boots the real backend + real frontend together and
  # drives them with a real browser via Playwright.
  e2e:
    needs: [backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        working-directory: e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  # Deployment only runs if the backend tests, frontend build/unit tests, AND
  # the full end-to-end suite all succeed.
  deploy-frontend:
    if: github.ref == 'refs/heads/main'
    needs: [backend, build-frontend, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
